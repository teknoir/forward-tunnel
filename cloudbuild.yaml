timeout: '18000s'

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/apps/forward-tunnel:latest'
      - '--label=git-version=${SHORT_SHA}'
      - '.'

images:
  - 'us-central1-docker.pkg.dev/${PROJECT_ID}/apps/forward-tunnel:latest'
